<!DOCTYPE html>
<html>
<head>
    <title>Sensor Dashboard</title>
</head>
<body>
    <h1>Sensor Dashboard</h1>
    <p>Temperature: <span id="temperature">--</span></p>
    <p>Light: <span id="light">--</span></p>
    <p>Fan state: <span id="fan">--</span></p>
    <p>Lamp state: <span id="lamp">--</span></p>

    <button onclick="sendCommand('fan_on')">Turn FAN ON</button>
    <button onclick="sendCommand('fan_off')">Turn FAN OFF</button>
    <button onclick="sendCommand('lamp_on')">Turn LAMP ON</button>
    <button onclick="sendCommand('lamp_off')">Turn LAMP OFF</button>

    <script>
        async function fetchData() {
            const res = await fetch("/data");
            const data = await res.json();
            document.getElementById("temperature").textContent = data.temperature;
            document.getElementById("light").textContent = data.light;
            document.getElementById("fan").textContent = data.fan;
            document.getElementById("lamp").textContent = data.lamp;
        }

        async function sendCommand(cmd) {
            await fetch("/control", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: "device=" + cmd
            });
            fetchData(); // odśwież stan po wysłaniu
        }

        setInterval(fetchData, 2000); // odświeżanie co 2 sekundy
        fetchData(); // początkowe pobranie
    </script>
</body>
</html>
