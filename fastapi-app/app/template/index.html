<!DOCTYPE html>
<html>
<style>
  svg {
    border: 1px solid #ccc;
    width: 600px;
    height: 400px;
  }
  rect.room {
    stroke: #000;
    stroke-width: 2;
    transition: fill 0.5s;
  }
  line.door {
    stroke: brown;
    stroke-width: 6;
  }
  circle.sensor {
    fill: blue;
  }
  circle.actuator {
    cursor: pointer;
    transition: fill 0.3s;
  }
  text {
    font-size: 12px;
    text-anchor: middle;
    dominant-baseline: middle;
    fill: white;
    font-weight: bold;
    pointer-events: none;
  }

  .container {
    display: flex;
    gap: 20px;
    align-items: flex-start;
    width: 1200px;
    margin-top: 50px;
  }
  .settings {
    width: 800px;
  }
  .svg-container {
    flex-grow: 1;
  }
</style>
<head>
    <title>Sensor Dashboard</title>
</head>
<body>

<div class="container">
  <div class="settings">
    <h1>Multiroom Dashboard</h1>

    {% for r in rooms %}
    <section style="border:1px solid #ccc; padding:10px; margin:10px;">
      <h2>{{ r }}</h2>
      <p>Temperature: <span id="{{ r }}_temperature">{{ sensor_data[r].temperature }}</span></p>
      <p>Light: <span id="{{ r }}_light">{{ sensor_data[r].light }}</span></p>
      <p>Fan: <span id="{{ r }}_fan">{{ sensor_data[r].fan }}</span></p>
      <p>Lamp: <span id="{{ r }}_lamp">{{ sensor_data[r].lamp }}</span></p>
      <p>Door: <span id="{{ r }}_door">{{ sensor_data[r].door }}</span></p>

      <form onsubmit="controlRoom(event, '{{ r }}')">
        <button name="device" value="fan_on" type="submit">Fan ON</button>
        <button name="device" value="fan_off" type="submit">Fan OFF</button>
        <button name="device" value="lamp_on" type="submit">Lamp ON</button>
        <button name="device" value="lamp_off" type="submit">Lamp OFF</button>
        <button name="device" value="door_open" type="submit">Door OPEN</button>
        <button name="device" value="door_close" type="submit">Door CLOSE</button>
      </form>

      <form onsubmit="updateTarget(event, '{{ r }}')">
        <label>Target temp:
          <input type="number" name="target_temperature" id="{{ r }}_target" value="{{ config[r].target_temperature }}">
        </label>
        <button type="submit">Save</button>
      </form>
    </section>
    {% endfor %}
  </div>

  <div class="svg-container">
    <svg id="housePlan">
      <!-- Pokoje -->
      <rect id="room1" class="room" x="10" y="10" width="250" height="150" fill="white"/>
      <rect id="room2" class="room" x="270" y="10" width="150" height="150" fill="white"/>
      <rect id="room3" class="room" x="10" y="170" width="410" height="150" fill="white"/>

      <!-- Drzwi frontowe -->
      <line x1="125" y1="10" x2="125" y2="0" class="door"/>

      <!-- Drzwi wewnętrzne salon - kuchnia -->
      <line x1="260" y1="60" x2="270" y2="60" class="door"/>

      <!-- Drzwi salon - sypialnia -->
      <line x1="80" y1="160" x2="80" y2="170" class="door"/>

      <!-- Drzwi kuchnia - sypialnia -->
      <line x1="350" y1="160" x2="350" y2="170" class="door"/>

      <circle class="sensor" id="door1" cx="125" cy="10" r="12"/>
      <text x="125" y="10">D</text>

      <!-- Sensory i aktuatory w salonie -->
      <circle class="sensor" cx="30" cy="30" r="12"/>
      <text x="30" y="30">T</text>

      <circle class="sensor" cx="135" cy="85" r="12"/>
      <text x="135" y="85">L</text>

      <circle class="sensor" cx="80" cy="160" r="12"/>
      <text x="80" y="160">M</text>

      <circle class="actuator" id="room1fan" cx="240" cy="20" r="12" fill="red"/>
      <text x="240" y="20">F</text>

      <circle class="actuator" id="room1light" cx="135" cy="85" r="12" fill="red"/>
      <text x="135" y="85">L</text>

      <!-- Sensory i aktuatory w kuchni -->
      <circle class="sensor" cx="300" cy="30" r="12"/>
      <text x="300" y="30">T</text>
      <circle class="sensor" cx="345" cy="85" r="12"/>
      <text x="345" y="85">L</text>
      <circle class="sensor" cx="320" cy="140" r="12"/>
      <text x="320" y="140">M</text>

      <circle class="actuator" id="room2light" cx="345" cy="60" r="12" fill="red"/>
      <text x="345" y="60">L</text>
      <circle class="actuator" id="room2fan" cx="280" cy="20" r="12" fill="red"/>
      <text x="280" y="20">F</text>

      <!-- Sensory i aktuatory w sypialni -->
      <circle class="sensor" cx="40" cy="200" r="12"/>
      <text x="40" y="200">T</text>
      <circle class="sensor" cx="200" cy="245" r="12"/>
      <text x="200" y="245">L</text>
      <circle class="sensor" cx="370" cy="300" r="12"/>
      <text x="370" y="300">M</text>

      <circle class="actuator" id="room3light" cx="200" cy="200" r="12" fill="red"/>
      <text x="200" y="200">L</text>
      <circle class="actuator" id="room3fan" cx="20" cy="320" r="12" fill="red"/>
      <text x="20" y="320">F</text>
    </svg>
  </div>
</div>

<script>
async function fetchData() {
    const res = await fetch("/data");
    const data = await res.json();
    const rooms = Object.keys(data);

    rooms.forEach(r => {
        // FIXED: Correct data access with data[r]
        document.getElementById(r + "_temperature").textContent = data[r].temperature;
        document.getElementById(r + "_light").textContent = data[r].light;
        document.getElementById(r + "_fan").textContent = data[r].fan;
        document.getElementById(r + "_lamp").textContent = data[r].lamp;
        document.getElementById(r + "_door").textContent = data[r].door;

        // FIXED: Correct data access for actuator colors
        document.getElementById(r + 'fan').setAttribute('fill', data[r].fan === 'ON' ? 'green' : 'red');
        document.getElementById(r + 'light').setAttribute('fill', data[r].lamp === 'ON' ? 'green' : 'red');

        // FIXED: Update room colors properly
        updateRoomColors(data[r], r);
    });
}

async function controlRoom(e, room) {
    e.preventDefault();
    const device = e.submitter.value;
    const body = new URLSearchParams();
    body.append("room", room);
    body.append("device", device);
    await fetch("/control", { method: "POST", body });
    fetchData();
}

async function updateTarget(e, room) {
    e.preventDefault();
    const input = document.getElementById(room + "_target");
    const body = new URLSearchParams();
    body.append("room", room);
    body.append("target_temperature", input.value);
    await fetch("/set-config", { method: "POST", body });
    alert("Saved");
}

// FIXED: Proper room color update logic
function updateRoomColors(roomData, roomID) {
    const room = document.getElementById(roomID);

    if (!room) return;

    // Room color logic:
    // - Gray if door is CLOSED (nobody inside)
    // - Yellow if door is OPEN and lamp is ON
    // - White if door is OPEN and there's enough natural light (>= 70)
    // - Light gray if door is OPEN but dark (< 70) and lamp is OFF

    if (roomData.door === "CLOSED") {
        room.style.fill = 'gray';  // Nobody inside
    } else if (roomData.door === "OPEN") {
        const light = parseInt(roomData.light) || 0;

        if (roomData.lamp === "ON") {
            room.style.fill = 'yellow';  // Lamp is on
        } else if (light >= 70) {
            room.style.fill = 'white';  // Enough natural light
        } else {
            room.style.fill = '#d3d3d3';  // Dark room, lamp off
        }
    }
}

setInterval(fetchData, 1500);
fetchData(); // Initial fetch
</script>

</body>
</html>
